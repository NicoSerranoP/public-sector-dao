[profile.default]
src = "src"
out = "out"
libs = ["lib"]

fs_permissions = [{ access = "write", path = "./artifacts" }]

# General
evm_version = "cancun"

optimizer = true
optimizer-runs = 200
solc = "0.8.28"
via_ir = false

# Suppress compiler warnings originating from dependency code (keeps warnings from src/test/script)
ignored_warnings_from = ["lib"]

[invariant]
runs = 256
depth = 100
fail_on_revert = false
